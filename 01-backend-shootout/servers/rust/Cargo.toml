[package]
name = "backend-shootout"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
